name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format-check
      - run: pnpm run typecheck
      - run: pnpm run knip
      - run: pnpm test
      - run: pnpm run build

      - name: Check dist/ is up to date
        run: git diff --exit-code dist/

      - run: pnpm run readme

      - name: Check README.md is up to date
        run: git diff --exit-code README.md

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/index.js

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist # overwrite dist/index.js

      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FRECKLE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.FRECKLE_AUTOMATION_PRIVATE_KEY }}
          repositories: megarepo

      # Run once with settings that are sure to find nothing (this repository
      # has nothing being kept up to date).
      - uses: ./
        with:
          dry-run: true

      # Run again with settings that are sure to find something (this repository
      # is really active and should always have open dependabot PRs).
      - uses: ./
        with:
          quarantine-days: -1
          github-token: ${{ steps.token.outputs.token }}
          github-repository: freckle/megarepo
          dry-run: true

      # Run again exercising exclude-title-regex
      - uses: ./
        with:
          exclude-title-regex: 'in /qa$'
          quarantine-days: -1
          github-token: ${{ steps.token.outputs.token }}
          github-repository: freckle/megarepo
          dry-run: true

      # Run as if we were a Dependabot-PR, so we can see the comment
      - uses: ./
        with:
          remove-reviewers: false
          github-actor: 'dependabot[bot]'

      # And test the when-message conditional
      - uses: ./
        with:
          quarantine-days: -1
          remove-reviewers: false
          github-actor: 'dependabot[bot]'

      # Run as if we were a Renovate-PR, to exercise the multiline bot-authors input
      - uses: ./
        with:
          remove-reviewers: false
          github-actor: 'renovate[bot]'
          bot-authors: |
            dependabot[bot]
            renovate[bot]

      # Escalation is gated to non-pull_request events; this job only ever
      # triggers on pull_request, so override GITHUB_EVENT_NAME for this step
      # only -- @actions/github's Context reads it straight from the env, so
      # this exercises the real gate without adding a public input for it.
      - name: Escalation dry-run
        uses: ./
        env:
          GITHUB_EVENT_NAME: schedule
        with:
          github-token: ${{ steps.token.outputs.token }}
          github-repository: freckle/megarepo
          bot-authors: |
            renovate[bot]
          escalate: true
          escalation-fallback-team: team-platform
          dry-run: true
