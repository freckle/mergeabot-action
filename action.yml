name: mergeabot
description: Auto-merge Dependabot PRs, only after quarantine days

inputs:
  exclude-title-regex:
    description: Exclude PRs whose titles match this regular expression
    required: true
    default: ""

  quarantine-days:
    description: |
      How long PRs must have gone since their last update to qualify for
      auto-merge. Default is 5, Set to -1 to disable
    required: true
    default: 5

  strategy:
    description: How to merge PRs, must be one of merge, rebase, or squash
    required: true
    default: rebase

  remove-reviewers:
    description: Remove any reviewers from bot PRs when they open?
    required: true
    default: true

  bot-authors:
    description: |
      Which dependency-bot PR authors to act on, one bot login per line.
      Defaults to Dependabot only; set to

        bot-authors: |
          dependabot[bot]
          renovate[bot]

      to also handle Renovate.
    required: true
    default: "dependabot[bot]"

  github-actor:
    description: "Override GitHub actor. This is mostly useful in testing."
    required: true
    default: "${{ github.actor }}"

  github-repository:
    description: "Override GitHub repository, if necessary"
    required: true
    default: "${{ github.repository }}"

  github-token:
    description: "Override GitHub token, if necessary"
    required: true
    default: "${{ github.token }}"

  dry-run:
    description: "Set to 1 to print, but not perform, any actions"
    required: true
    default: 0

  escalate:
    description: |
      On scheduled runs, request a team reviewer (and leave a triage comment)
      on bot PRs that have failing statuses and no reviewer, so they don't sit
      unmerged and unnoticed. Off by default. Requires a token that can request
      team reviewers (e.g. a GitHub App token, not the default Actions token).
    required: true
    default: false

  escalation-fallback-team:
    description: |
      Team slug to request when CODEOWNERS resolves to no team, or to more than
      one (a PR spanning multiple teams). When empty, such PRs are skipped.
    required: true
    default: ""

  escalation-team-prefix:
    description: |
      Only CODEOWNERS owners of the form @org/<prefix>* are treated as routable
      teams (others, e.g. individuals, are ignored for routing).
    required: true
    default: "team-"

  codeowners-path:
    description: "Path to the CODEOWNERS file used for escalation routing"
    required: true
    default: ".github/CODEOWNERS"

outputs: {}

runs:
  using: composite
  steps:
    - name: Auto-merge Dependabot PRs
      shell: bash
      run: ${{ github.action_path }}/bin/automerge-prs
      env:
        EXCLUDE_TITLE_REGEX: ${{ inputs.exclude-title-regex }}
        QUARANTINE_DAYS: ${{ inputs.quarantine-days }}
        STRATEGY: ${{ inputs.strategy }}
        REMOVE_REVIEWERS: ${{ inputs.remove-reviewers }}
        BOT_AUTHORS: ${{ inputs.bot-authors }}
        DRY_RUN: ${{ inputs.dry-run }}

        GH_TOKEN: ${{ inputs.github-token }}
        GH_ACTOR: ${{ inputs.github-actor }}
        GH_REPO: ${{ inputs.github-repository }}
        GH_EVENT: ${{ github.event_name }}
        GH_PR_ACTION: ${{ github.event.action }}
        GH_PR_NUMBER: ${{ github.event.number }}
        GH_PR_TITLE: ${{ github.event.pull_request.title }}

    # Escalation is a scheduled sweep, not a per-PR-event reaction.
    - name: Escalate failing bot PRs
      if: ${{ inputs.escalate == 'true' && github.event_name != 'pull_request' }}
      shell: bash
      run: ${{ github.action_path }}/bin/escalate-failing-prs
      env:
        BOT_AUTHORS: ${{ inputs.bot-authors }}
        ESCALATION_FALLBACK_TEAM: ${{ inputs.escalation-fallback-team }}
        ESCALATION_TEAM_PREFIX: ${{ inputs.escalation-team-prefix }}
        CODEOWNERS_PATH: ${{ inputs.codeowners-path }}
        DRY_RUN: ${{ inputs.dry-run }}

        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ inputs.github-repository }}
