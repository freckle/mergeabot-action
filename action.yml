name: mergeabot
description: Auto-merge Dependabot PRs, only after quarantine days

inputs:
  exclude-title-regex:
    description: Exclude PRs whose titles match this regular expression
    required: true
    default: ""

  quarantine-days:
    description: |
      How long PRs must have gone since their last update to qualify for
      auto-merge. Default is 5, Set to -1 to disable
    required: true
    default: 5

  strategy:
    description: How to merge PRs, must be one of merge, rebase, or squash
    required: true
    default: rebase

  remove-reviewers:
    description: Remove any reviewers from bot PRs when they open?
    required: true
    default: true

  bot-authors:
    description: |
      Which PR authors to act on, one login per line. Not limited to bots --
      any author login works. Defaults to Dependabot and Renovate; set to

        bot-authors: |
          dependabot[bot]

      to restrict to Dependabot only.
    required: true
    default: |
      dependabot[bot]
      renovate[bot]

  github-actor:
    description: "Override GitHub actor. This is mostly useful in testing."
    required: true
    default: "${{ github.actor }}"

  github-repository:
    description: "Override GitHub repository, if necessary"
    required: true
    default: "${{ github.repository }}"

  github-token:
    description: "Override GitHub token, if necessary"
    required: true
    default: "${{ github.token }}"

  dry-run:
    description: "Set to 1 to print, but not perform, any actions"
    required: true
    default: 0

outputs: {}

runs:
  using: node24
  main: dist/index.js
