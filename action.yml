name: mergeabot
description: Auto-merge Dependabot PRs, only after quarantine days

inputs:
  exclude-title-regex:
    description: Exclude PRs whose titles match this regular expression
    required: true
    default: ""

  quarantine-days:
    description: |
      How long PRs must have gone since their last update to qualify for
      auto-merge. Default is 5, Set to -1 to disable
    required: true
    default: 5

  strategy:
    description: How to merge PRs, must be one of merge, rebase, or squash
    required: true
    default: rebase

  remove-reviewers:
    description: Remove any reviewers from bot PRs when they open?
    required: true
    default: true

  bot-authors:
    description: |
      Which PR authors to act on, one login per line. Not limited to bots --
      any author login works. Defaults to Dependabot and Renovate. Set to a
      single-entry list (dependabot[bot]) to restrict to Dependabot only.
    required: true
    default: |
      dependabot[bot]
      renovate[bot]

  github-actor:
    description: "Override GitHub actor. This is mostly useful in testing."
    required: true
    default: "${{ github.actor }}"

  github-repository:
    description: "Override GitHub repository, if necessary"
    required: true
    default: "${{ github.repository }}"

  github-token:
    description: "Override GitHub token, if necessary"
    required: true
    default: "${{ github.token }}"

  dry-run:
    description: "Set to true to print, but not perform, any actions"
    required: true
    default: false

  escalate:
    description: |
      On scheduled runs, request a team reviewer (and leave a triage comment)
      on bot PRs that have failing statuses and no reviewer, so they don't sit
      unmerged and unnoticed. Off by default. Requires a token that can request
      team reviewers (e.g. a GitHub App token, not the default Actions token).
    required: true
    default: false

  escalation-fallback-team:
    description: |
      Team slug to request when CODEOWNERS resolves to no team. When empty,
      such PRs are skipped. A PR spanning multiple teams' paths is routed to
      all of those teams instead of this fallback.
    required: true
    default: ""

  escalation-team-prefix:
    description: |
      Only CODEOWNERS owners of the form @org/<prefix>* are treated as routable
      teams (others, e.g. individuals, are ignored for routing).
    required: true
    default: "team-"

  codeowners-path:
    description: "Path to the CODEOWNERS file used for escalation routing"
    required: true
    default: ".github/CODEOWNERS"

outputs: {}

runs:
  using: node24
  main: dist/index.js
